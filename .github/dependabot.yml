version: 2

# OFF since 2026-11-05: the project is closed (ADR-013 close-out). A limit of
# 0 is GitHub's documented way to stop version-update PRs while keeping the
# config. To turn them back on, restore the limits below (npm was 5; actions
# had none, so the default of 5).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Monthly: a weekly batch of patch bumps costs a serial merge queue
      # (~5 min each) for no user-visible change. Security fixes come
      # from Dependabot security updates (a repo setting), not this schedule.
      interval: monthly
    open-pull-requests-limit: 0
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # One PR per toolchain rather than one per package. Twenty separate
      # Storybook bumps is noise that trains you to merge without reading.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      storybook:
        patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "playwright", "jsdom"]
      linting:
        patterns: ["eslint", "eslint-plugin-*", "typescript", "typescript-eslint"]
      styling:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss"]
    ignore:
      # Majors land as deliberate, ADR-backed upgrades, not as a routine bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
