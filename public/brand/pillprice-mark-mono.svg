<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pill Price">
  <title>Pill Price</title>

  <!-- Single-colour form of the mark (ui-spec §14): favicon and any one-colour
       context. The counters and the capsule seam are knocked out through a
       mask rather than filled with the surface colour, so the mark sits on any
       background instead of only on --surface-base.

       The colour is a literal here, not a token: an SVG served as an image has
       no access to the CSS custom properties. It is --space-blue. -->
  <mask id="ppm">
    <rect width="120" height="120" fill="#000000"/>
    <g fill="#FFFFFF">
      <rect x="19" y="39" width="16" height="56" rx="3"/>
      <polygon points="11,93 43,93 27,110"/>
      <path d="M60,20 H37 A19,19 0 0,0 37,58 H60 Z"/>
      <rect x="85" y="39" width="16" height="56" rx="3"/>
      <polygon points="77,93 109,93 93,110"/>
      <path d="M60,20 H83 A19,19 0 0,1 83,58 H60 Z"/>
    </g>
    <g fill="#000000">
      <rect x="41" y="30" width="14" height="18" rx="5"/>
      <rect x="65" y="30" width="14" height="18" rx="5"/>
      <rect x="58.5" y="20" width="3" height="38"/>
    </g>
  </mask>

  <rect width="120" height="120" fill="#18314F" mask="url(#ppm)"/>
</svg>
