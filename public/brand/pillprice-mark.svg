<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pill Price">
  <title>Pill Price</title>

  <!-- Left P: stem + downward arrowhead -->
  <rect x="19" y="39" width="16" height="56" rx="3" fill="#18314F"/>
  <polygon points="11,93 43,93 27,110" fill="#18314F"/>
  <!-- Left P: bowl = left half of capsule -->
  <path d="M60,20 H37 A19,19 0 0,0 37,58 H60 Z" fill="#18314F"/>

  <!-- Right P (mirrored): stem + downward arrowhead -->
  <rect x="85" y="39" width="16" height="56" rx="3" fill="#B27C66"/>
  <polygon points="77,93 109,93 93,110" fill="#B27C66"/>
  <!-- Right P: bowl = right half of capsule -->
  <path d="M60,20 H83 A19,19 0 0,1 83,58 H60 Z" fill="#B27C66"/>

  <!-- Counters: squarer and smaller so the mark reads as letterforms, not eyes -->
  <rect x="41" y="30" width="14" height="18" rx="5" fill="#F8F7FC"/>
  <rect x="65" y="30" width="14" height="18" rx="5" fill="#F8F7FC"/>

  <!-- Capsule seam -->
  <rect x="58.5" y="20" width="3" height="38" fill="#F8F7FC"/>
</svg>
